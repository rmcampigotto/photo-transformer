<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>photo-transformer</title>
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: #888;
      --bar: #fff;
      --tap: 52px;
      --safe: env(safe-area-inset-bottom, 0px);
      --err: #ff6b6b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: 24px 20px calc(24px + var(--safe));
      gap: 20px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--fg);
    }
    .screen { display: none; width: min(100%, 320px); flex-direction: column; align-items: stretch; gap: 16px; }
    .screen.active { display: flex; }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field label { font-size: 0.8rem; color: var(--muted); }
    .field input {
      min-height: var(--tap);
      width: 100%;
      border: 1.5px solid #333;
      border-radius: 12px;
      background: #111;
      color: var(--fg);
      font-size: 1rem;
      padding: 0 14px;
      outline: none;
      -webkit-appearance: none;
    }
    .field input:focus { border-color: #666; }
    .error {
      font-size: 0.85rem;
      color: var(--err);
      text-align: center;
      min-height: 1.2em;
    }
    .preview {
      width: 100%;
      aspect-ratio: 1;
      background: #111;
      border-radius: 12px;
      overflow: hidden;
      display: none;
      position: relative;
    }
    .preview.visible { display: block; }
    .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .preview-badge {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      pointer-events: none;
    }
    .progress {
      width: 100%;
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    .progress.visible { display: block; }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--bar);
      transition: width 0.2s ease;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 12px;
      width: 100%;
    }
    .btn {
      min-height: var(--tap);
      width: 100%;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }
    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary {
      background: var(--fg);
      color: var(--bg);
    }
    .btn-upload {
      background: var(--fg);
      color: var(--bg);
    }
    .btn-drive {
      background: transparent;
      color: var(--fg);
      border: 1.5px solid #444;
    }
    .btn-drive.connected {
      border-color: var(--fg);
    }
    .btn-download {
      background: transparent;
      color: var(--fg);
      border: 1.5px solid #444;
    }
    .btn-download:not(:disabled) {
      border-color: var(--fg);
    }
    .btn-process {
      background: var(--fg);
      color: var(--bg);
      display: none;
    }
    .btn-process.visible { display: block; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 40px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }
    .topbar h1 { flex: 1; text-align: center; }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      min-height: 1.2em;
    }
    .hidden-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    .drive-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 100%;
    }
    .drive-panel.visible { display: flex; }
    .drive-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .drive-back {
      flex-shrink: 0;
      min-height: 36px;
      padding: 0 10px;
      border: 1.5px solid #444;
      border-radius: 10px;
      background: transparent;
      color: var(--fg);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .drive-back:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .drive-path {
      flex: 1;
      font-size: 0.8rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .drive-list {
      max-height: 240px;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      border: 1.5px solid #333;
      border-radius: 12px;
      background: #111;
    }
    .drive-item {
      display: flex;
      align-items: center;
      gap: 10px;
      width: 100%;
      min-height: 48px;
      padding: 8px 12px;
      border: none;
      border-bottom: 1px solid #222;
      background: transparent;
      color: var(--fg);
      font-size: 0.9rem;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .drive-item:last-child { border-bottom: none; }
    .drive-item:active { background: #1a1a1a; }
    .drive-item.selected { background: #1a1a1a; }
    .drive-item img {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }
    .drive-icon {
      width: 36px;
      height: 36px;
      border-radius: 6px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 1.1rem;
    }
    .drive-item span.name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .drive-check {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      border: 1.5px solid #555;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.75rem;
      color: #000;
      background: transparent;
    }
    .drive-item.selected .drive-check {
      background: #fff;
      border-color: #fff;
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div class="screen" id="loginScreen">
    <h1>photo-transformer</h1>
    <form id="loginForm" class="actions" autocomplete="on">
      <div class="field">
        <label for="userInput">Usuário</label>
        <input id="userInput" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
      </div>
      <div class="field">
        <label for="passInput">Senha</label>
        <input id="passInput" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="error" id="loginError" aria-live="polite"></p>
      <button type="submit" class="btn btn-primary" id="btnLogin">Entrar</button>
    </form>
  </div>

  <div class="screen" id="appScreen">
    <div class="topbar">
      <span style="width:48px"></span>
      <h1>photo-transformer</h1>
      <button type="button" class="btn btn-ghost" id="btnLogout" style="width:auto;padding:0 8px">Sair</button>
    </div>

    <div class="preview" id="preview" aria-hidden="true">
      <img id="previewImg" alt="Pré-visualização 1200×1200" />
      <span class="preview-badge" id="previewBadge" hidden></span>
    </div>

    <div class="progress" id="progress" aria-hidden="true" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="drive-panel" id="drivePanel">
      <div class="drive-nav">
        <button type="button" class="drive-back" id="btnDriveBack" disabled>Voltar</button>
        <span class="drive-path" id="drivePath">Meu Drive</span>
      </div>
      <div class="drive-list" id="driveList" aria-label="Pastas e arquivos do Drive"></div>
      <button type="button" class="btn btn-process" id="btnProcessDrive" disabled>Processar selecionadas</button>
    </div>

    <div class="actions">
      <input type="file" id="fileInput" class="hidden-input" accept="image/*" multiple />
      <button type="button" class="btn btn-upload" id="btnUpload">Upload</button>
      <button type="button" class="btn btn-drive" id="btnDrive">Conectar Drive</button>
      <button type="button" class="btn btn-download" id="btnDownload" disabled>Download</button>
    </div>

    <p class="hint" id="hint">1200×1200 · foto inteira · fundo branco</p>
  </div>

  <script>
(function () {
  "use strict";

  var SIZE = 1200;
  var JPEG_QUALITY = 0.92;
  var SESSION_KEY = "pt_auth";
  var DRIVE_TOKEN_KEY = "pt_drive_token";
  var USER = "admin";
  var PASS = "rmcampigotto@123";
  var GOOGLE_CLIENT_ID = "440396226410-dmmt5bh0r93atn83hoq3bee0d09ejkg8.apps.googleusercontent.com";
  var DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.readonly";
  var FOLDER_MIME = "application/vnd.google-apps.folder";

  var loginScreen = document.getElementById("loginScreen");
  var appScreen = document.getElementById("appScreen");
  var loginForm = document.getElementById("loginForm");
  var loginError = document.getElementById("loginError");
  var btnLogout = document.getElementById("btnLogout");

  var fileInput = document.getElementById("fileInput");
  var btnUpload = document.getElementById("btnUpload");
  var btnDrive = document.getElementById("btnDrive");
  var btnDownload = document.getElementById("btnDownload");
  var btnProcessDrive = document.getElementById("btnProcessDrive");
  var btnDriveBack = document.getElementById("btnDriveBack");
  var preview = document.getElementById("preview");
  var previewImg = document.getElementById("previewImg");
  var previewBadge = document.getElementById("previewBadge");
  var progress = document.getElementById("progress");
  var progressBar = document.getElementById("progressBar");
  var hint = document.getElementById("hint");
  var drivePanel = document.getElementById("drivePanel");
  var driveList = document.getElementById("driveList");
  var drivePath = document.getElementById("drivePath");

  var results = [];
  var downloadUrl = null;
  var downloadName = "photo-1200x1200.jpg";
  var driveAccessToken = null;
  var tokenClient = null;
  var busy = false;
  var driveFolderId = "root";
  var driveFolderStack = [{ id: "root", name: "Meu Drive" }];
  var driveSelected = {};

  function showLogin() {
    loginScreen.classList.add("active");
    appScreen.classList.remove("active");
    loginError.textContent = "";
  }

  function showApp() {
    loginScreen.classList.remove("active");
    appScreen.classList.add("active");
  }

  function isAuthed() {
    try { return sessionStorage.getItem(SESSION_KEY) === "1"; } catch (e) { return false; }
  }

  function setAuthed(on) {
    try {
      if (on) sessionStorage.setItem(SESSION_KEY, "1");
      else sessionStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  function loadStoredToken() {
    try {
      var t = sessionStorage.getItem(DRIVE_TOKEN_KEY);
      if (t) driveAccessToken = t;
    } catch (e) {}
  }

  function storeToken(token) {
    driveAccessToken = token || null;
    try {
      if (token) sessionStorage.setItem(DRIVE_TOKEN_KEY, token);
      else sessionStorage.removeItem(DRIVE_TOKEN_KEY);
    } catch (e) {}
  }

  function updateDriveButton() {
    if (driveAccessToken) {
      btnDrive.textContent = "Do Drive";
      btnDrive.classList.add("connected");
    } else {
      btnDrive.textContent = "Conectar Drive";
      btnDrive.classList.remove("connected");
      hideDrivePanel();
    }
  }

  function hideDrivePanel() {
    drivePanel.classList.remove("visible");
    driveList.innerHTML = "";
    btnProcessDrive.classList.remove("visible");
    btnProcessDrive.disabled = true;
    driveSelected = {};
  }

  function updateProcessButton() {
    var n = Object.keys(driveSelected).length;
    if (n > 0) {
      btnProcessDrive.classList.add("visible");
      btnProcessDrive.disabled = busy;
      btnProcessDrive.textContent = n === 1
        ? "Processar 1 selecionada"
        : "Processar " + n + " selecionadas";
    } else {
      btnProcessDrive.classList.remove("visible");
      btnProcessDrive.disabled = true;
      btnProcessDrive.textContent = "Processar selecionadas";
    }
  }

  function updateDrivePath() {
    var names = driveFolderStack.map(function (f) { return f.name; });
    drivePath.textContent = names.join(" / ");
    btnDriveBack.disabled = driveFolderStack.length <= 1 || busy;
  }

  function authErrorHint(err) {
    var msg = (err && (err.error || err.message || err.type)) || "";
    msg = String(msg).toLowerCase();
    if (msg.indexOf("popup_closed") !== -1 || msg.indexOf("popup_closed_by_user") !== -1) {
      return "Login cancelado";
    }
    if (msg.indexOf("access_denied") !== -1) {
      return "Acesso negado. Verifique permissões no Google";
    }
    if (msg.indexOf("idpiframe_initialization_failed") !== -1 || msg.indexOf("origin") !== -1) {
      return "Origem não autorizada no Google Cloud";
    }
    if (msg.indexOf("immediate_failed") !== -1) {
      return "Sessão Google expirada. Conecte novamente";
    }
    return "Falha na autenticação Google";
  }

  function ensureTokenClient() {
    if (tokenClient) return true;
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      hint.textContent = "Google Identity ainda carregando…";
      return false;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: function (resp) {
        if (resp && resp.error) {
          console.error(resp);
          hint.textContent = authErrorHint(resp);
          return;
        }
        if (!resp || !resp.access_token) {
          hint.textContent = "Falha na autenticação Google";
          return;
        }
        storeToken(resp.access_token);
        updateDriveButton();
        hint.textContent = "Drive conectado";
        openDriveBrowser();
      },
      error_callback: function (err) {
        console.error(err);
        hint.textContent = authErrorHint(err);
      }
    });
    return true;
  }

  function connectDrive() {
    if (!ensureTokenClient()) return;
    hint.textContent = "Abrindo Google…";
    try {
      tokenClient.requestAccessToken({ prompt: driveAccessToken ? "" : "consent" });
    } catch (e) {
      console.error(e);
      hint.textContent = authErrorHint(e);
    }
  }

  function openDriveBrowser() {
    driveFolderStack = [{ id: "root", name: "Meu Drive" }];
    driveFolderId = "root";
    driveSelected = {};
    listDriveFolder("root");
  }

  async function listDriveFolder(folderId) {
    if (!driveAccessToken) {
      connectDrive();
      return;
    }
    if (busy) return;
    busy = true;
    btnDrive.disabled = true;
    btnDriveBack.disabled = true;
    btnProcessDrive.disabled = true;
    hint.textContent = "Carregando pasta…";
    setProgress(15, true);
    driveList.innerHTML = "";
    drivePanel.classList.add("visible");
    updateDrivePath();

    var q = "'" + folderId + "' in parents and trashed=false and (mimeType = '" + FOLDER_MIME + "' or mimeType contains 'image/')";
    var url = "https://www.googleapis.com/drive/v3/files"
      + "?pageSize=100"
      + "&q=" + encodeURIComponent(q)
      + "&fields=" + encodeURIComponent("files(id,name,mimeType,thumbnailLink)")
      + "&orderBy=" + encodeURIComponent("folder,name");

    try {
      var res = await fetch(url, {
        headers: { Authorization: "Bearer " + driveAccessToken }
      });
      if (res.status === 401 || res.status === 403) {
        storeToken(null);
        updateDriveButton();
        hint.textContent = "Sessão Drive expirada. Conecte novamente";
        setProgress(0, false);
        hideDrivePanel();
        return;
      }
      if (!res.ok) {
        var body = "";
        try { body = await res.text(); } catch (e) {}
        console.error("Drive list", res.status, body);
        hint.textContent = "Erro ao listar pasta do Drive";
        setProgress(0, false);
        return;
      }
      var data = await res.json();
      var files = (data && data.files) || [];
      setProgress(100, true);
      renderDriveList(files);
      var selCount = Object.keys(driveSelected).length;
      if (!files.length) {
        hint.textContent = "Pasta vazia";
      } else if (selCount > 0) {
        hint.textContent = selCount + " selecionada(s) · toque pasta ou imagem";
      } else {
        hint.textContent = "Pastas e imagens · toque para abrir/selecionar";
      }
      setTimeout(function () { setProgress(0, false); }, 300);
    } catch (err) {
      console.error(err);
      hint.textContent = "Erro de rede ao acessar o Drive";
      setProgress(0, false);
    } finally {
      busy = false;
      btnDrive.disabled = false;
      updateDrivePath();
      updateProcessButton();
    }
  }

  function renderDriveList(files) {
    driveList.innerHTML = "";
    var folders = [];
    var images = [];
    files.forEach(function (f) {
      if (f.mimeType === FOLDER_MIME) folders.push(f);
      else images.push(f);
    });

    folders.forEach(function (f) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "drive-item";
      var icon = document.createElement("div");
      icon.className = "drive-icon";
      icon.textContent = "📁";
      btn.appendChild(icon);
      var span = document.createElement("span");
      span.className = "name";
      span.textContent = f.name || f.id;
      btn.appendChild(span);
      btn.addEventListener("click", function () {
        enterFolder(f.id, f.name || "Pasta");
      });
      driveList.appendChild(btn);
    });

    images.forEach(function (f) {
      var btn = document.createElement("button");
      btn.type = "button";
      btn.className = "drive-item";
      if (driveSelected[f.id]) btn.classList.add("selected");
      btn.setAttribute("data-id", f.id);

      if (f.thumbnailLink) {
        var img = document.createElement("img");
        img.alt = "";
        img.referrerPolicy = "no-referrer";
        img.src = f.thumbnailLink;
        img.onerror = function () { img.style.display = "none"; };
        btn.appendChild(img);
      } else {
        var icon = document.createElement("div");
        icon.className = "drive-icon";
        icon.textContent = "🖼";
        btn.appendChild(icon);
      }

      var span = document.createElement("span");
      span.className = "name";
      span.textContent = f.name || f.id;
      btn.appendChild(span);

      var check = document.createElement("span");
      check.className = "drive-check";
      check.textContent = driveSelected[f.id] ? "✓" : "";
      btn.appendChild(check);

      btn.addEventListener("click", function () {
        toggleDriveSelect(f, btn, check);
      });
      driveList.appendChild(btn);
    });
  }

  function toggleDriveSelect(file, btn, check) {
    if (driveSelected[file.id]) {
      delete driveSelected[file.id];
      btn.classList.remove("selected");
      check.textContent = "";
    } else {
      driveSelected[file.id] = { id: file.id, name: file.name || "image.jpg" };
      btn.classList.add("selected");
      check.textContent = "✓";
    }
    updateProcessButton();
    var n = Object.keys(driveSelected).length;
    hint.textContent = n > 0
      ? n + " selecionada(s)"
      : "Pastas e imagens · toque para abrir/selecionar";
  }

  function enterFolder(id, name) {
    if (busy) return;
    driveFolderStack.push({ id: id, name: name });
    driveFolderId = id;
    listDriveFolder(id);
  }

  function goBackFolder() {
    if (busy || driveFolderStack.length <= 1) return;
    driveFolderStack.pop();
    var current = driveFolderStack[driveFolderStack.length - 1];
    driveFolderId = current.id;
    listDriveFolder(driveFolderId);
  }

  async function downloadDriveFile(id, name) {
    var url = "https://www.googleapis.com/drive/v3/files/" + encodeURIComponent(id) + "?alt=media";
    var res = await fetch(url, {
      headers: { Authorization: "Bearer " + driveAccessToken }
    });
    if (res.status === 401 || res.status === 403) {
      storeToken(null);
      updateDriveButton();
      throw new Error("auth");
    }
    if (!res.ok) throw new Error("download");
    var blob = await res.blob();
    return new File([blob], name, { type: blob.type || "image/jpeg" });
  }

  async function processDriveSelection() {
    var items = Object.keys(driveSelected).map(function (k) { return driveSelected[k]; });
    if (!items.length || busy) return;
    if (!driveAccessToken) {
      connectDrive();
      return;
    }

    busy = true;
    setBusyUI(true);
    hideDrivePanel();
    clearResults();
    hint.textContent = "Baixando do Drive…";
    setProgress(5, true);

    var files = [];
    try {
      for (var i = 0; i < items.length; i++) {
        hint.textContent = "Baixando " + (i + 1) + " de " + items.length + "…";
        setProgress(((i + 0.5) / items.length) * 40, true);
        try {
          var file = await downloadDriveFile(items[i].id, items[i].name);
          files.push(file);
        } catch (err) {
          if (err && err.message === "auth") {
            hint.textContent = "Sessão Drive expirada. Conecte novamente";
            setProgress(0, false);
            return;
          }
          console.error(err);
        }
        setProgress(((i + 1) / items.length) * 40, true);
      }

      if (!files.length) {
        hint.textContent = "Erro ao baixar do Drive";
        setProgress(0, false);
        return;
      }

      busy = false;
      await processFiles(files);
    } catch (err) {
      console.error(err);
      hint.textContent = "Erro de rede ao baixar do Drive";
      setProgress(0, false);
    } finally {
      busy = false;
      setBusyUI(false);
    }
  }

  function setBusyUI(on) {
    btnUpload.disabled = on;
    btnDrive.disabled = on;
    btnDownload.disabled = on || !results.length;
    btnProcessDrive.disabled = on || Object.keys(driveSelected).length === 0;
    btnDriveBack.disabled = on || driveFolderStack.length <= 1;
  }

  loadStoredToken();
  updateDriveButton();

  if (isAuthed()) showApp();
  else showLogin();

  loginForm.addEventListener("submit", function (e) {
    e.preventDefault();
    var u = (document.getElementById("userInput").value || "").trim();
    var p = document.getElementById("passInput").value || "";
    if (u === USER && p === PASS) {
      setAuthed(true);
      loginError.textContent = "";
      document.getElementById("passInput").value = "";
      showApp();
    } else {
      loginError.textContent = "Usuário ou senha incorretos";
    }
  });

  btnLogout.addEventListener("click", function () {
    setAuthed(false);
    storeToken(null);
    updateDriveButton();
    clearResults();
    hideDrivePanel();
    showLogin();
  });

  btnUpload.addEventListener("click", function () {
    fileInput.click();
  });

  fileInput.addEventListener("change", function () {
    var list = fileInput.files;
    fileInput.value = "";
    if (!list || !list.length) return;
    var files = [];
    for (var i = 0; i < list.length; i++) {
      if (list[i].type && list[i].type.indexOf("image/") === 0) files.push(list[i]);
      else if (!list[i].type) files.push(list[i]);
    }
    if (!files.length) {
      hint.textContent = "Nenhuma imagem válida";
      return;
    }
    processFiles(files);
  });

  btnDrive.addEventListener("click", function () {
    if (driveAccessToken) openDriveBrowser();
    else connectDrive();
  });

  btnDriveBack.addEventListener("click", goBackFolder);
  btnProcessDrive.addEventListener("click", processDriveSelection);

  btnDownload.addEventListener("click", function () {
    if (!results.length || !downloadUrl) return;
    var a = document.createElement("a");
    a.href = downloadUrl;
    a.download = downloadName;
    a.rel = "noopener";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
  });

  function setProgress(pct, show) {
    if (show) {
      progress.classList.add("visible");
      progress.setAttribute("aria-hidden", "false");
    } else {
      progress.classList.remove("visible");
      progress.setAttribute("aria-hidden", "true");
    }
    var n = Math.max(0, Math.min(100, Math.round(pct)));
    progressBar.style.width = n + "%";
    progress.setAttribute("aria-valuenow", String(n));
  }

  function clearResults() {
    if (downloadUrl) URL.revokeObjectURL(downloadUrl);
    results.forEach(function (r) {
      if (r.url) URL.revokeObjectURL(r.url);
    });
    results = [];
    downloadUrl = null;
    downloadName = "photo-1200x1200.jpg";
    previewImg.removeAttribute("src");
    preview.classList.remove("visible");
    preview.setAttribute("aria-hidden", "true");
    previewBadge.hidden = true;
    previewBadge.textContent = "";
    btnDownload.disabled = true;
  }

  function baseName(name) {
    var n = name || "photo";
    var i = n.lastIndexOf(".");
    return i > 0 ? n.slice(0, i) : n;
  }

  function uniqueName(base, used) {
    var name = base + "-1200x1200.jpg";
    var n = 2;
    while (used[name]) {
      name = base + "-" + n + "-1200x1200.jpg";
      n++;
    }
    used[name] = true;
    return name;
  }

  function loadOriented(blob) {
    if (typeof createImageBitmap === "function") {
      return createImageBitmap(blob, { imageOrientation: "from-image" }).catch(function () {
        return createImageBitmap(blob).catch(function () {
          return loadViaImage(blob);
        });
      });
    }
    return loadViaImage(blob);
  }

  function loadViaImage(blob) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("Falha ao carregar"));
      };
      img.src = url;
    });
  }

  function containToSquare(source) {
    var sw = source.width;
    var sh = source.height;
    if (!sw || !sh) throw new Error("Dimensões inválidas");
    var scale = Math.min(SIZE / sw, SIZE / sh);
    var dw = Math.round(sw * scale);
    var dh = Math.round(sh * scale);
    var dx = Math.floor((SIZE - dw) / 2);
    var dy = Math.floor((SIZE - dh) / 2);
    var canvas = document.createElement("canvas");
    canvas.width = SIZE;
    canvas.height = SIZE;
    var ctx = canvas.getContext("2d");
    if (!ctx) throw new Error("Canvas indisponível");
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(source, 0, 0, sw, sh, dx, dy, dw, dh);
    return canvas;
  }

  function canvasToBlob(canvas) {
    return new Promise(function (resolve, reject) {
      if (canvas.toBlob) {
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob);
          else reject(new Error("toBlob falhou"));
        }, "image/jpeg", JPEG_QUALITY);
      } else {
        try {
          var dataUrl = canvas.toDataURL("image/jpeg", JPEG_QUALITY);
          var parts = dataUrl.split(",");
          var bin = atob(parts[1]);
          var arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          resolve(new Blob([arr], { type: "image/jpeg" }));
        } catch (e) {
          reject(e);
        }
      }
    });
  }

  async function processOne(file) {
    var source = null;
    try {
      source = await loadOriented(file);
      var canvas = containToSquare(source);
      var blob = await canvasToBlob(canvas);
      return { blob: blob, sourceName: file.name || "photo" };
    } finally {
      if (source && typeof source.close === "function") {
        try { source.close(); } catch (e) {}
      }
    }
  }

  async function buildDownload(items) {
    if (downloadUrl) {
      URL.revokeObjectURL(downloadUrl);
      downloadUrl = null;
    }
    if (items.length === 1) {
      downloadUrl = items[0].url;
      downloadName = items[0].name;
      return;
    }
    if (typeof JSZip === "undefined") {
      throw new Error("JSZip indisponível");
    }
    var zip = new JSZip();
    items.forEach(function (r) {
      zip.file(r.name, r.blob);
    });
    var zipBlob = await zip.generateAsync({ type: "blob" }, function (meta) {
      setProgress(90 + (meta.percent || 0) * 0.1, true);
    });
    downloadUrl = URL.createObjectURL(zipBlob);
    downloadName = "photo-transformer.zip";
  }

  async function processFiles(files) {
    if (busy) return;
    busy = true;
    clearResults();
    setBusyUI(true);
    hideDrivePanel();

    var total = files.length;
    var usedNames = {};
    var ok = 0;
    var fail = 0;

    hint.textContent = total === 1 ? "Processando…" : "Processando 1 de " + total + "…";
    setProgress(2, true);

    try {
      for (var i = 0; i < total; i++) {
        hint.textContent = total === 1
          ? "Processando…"
          : "Foto " + (i + 1) + " de " + total;
        setProgress(((i) / total) * 85 + 2, true);
        try {
          var out = await processOne(files[i]);
          var name = uniqueName(baseName(out.sourceName), usedNames);
          var url = URL.createObjectURL(out.blob);
          results.push({ blob: out.blob, name: name, url: url });
          ok++;
          previewImg.src = url;
          preview.classList.add("visible");
          preview.setAttribute("aria-hidden", "false");
          if (total > 1) {
            previewBadge.hidden = false;
            previewBadge.textContent = ok + " / " + total;
          } else {
            previewBadge.hidden = true;
          }
        } catch (err) {
          console.error(err);
          fail++;
        }
        setProgress(((i + 1) / total) * 85 + 2, true);
      }

      if (!results.length) {
        hint.textContent = "Erro ao processar as imagens";
        clearResults();
        setProgress(0, false);
        return;
      }

      hint.textContent = results.length > 1 ? "Gerando ZIP…" : "Finalizando…";
      setProgress(88, true);
      await buildDownload(results);
      setProgress(100, true);

      btnDownload.disabled = false;
      if (results.length === 1) {
        hint.textContent = "Pronto · 1200×1200";
        btnDownload.textContent = "Download";
      } else {
        previewBadge.hidden = false;
        previewBadge.textContent = results.length + " prontas";
        hint.textContent = fail
          ? results.length + " prontas · " + fail + " com erro · ZIP"
          : results.length + " prontas · photo-transformer.zip";
        btnDownload.textContent = "Download ZIP";
      }
    } catch (err) {
      console.error(err);
      hint.textContent = "Erro ao processar as imagens";
      clearResults();
    } finally {
      busy = false;
      setBusyUI(false);
      setTimeout(function () { setProgress(0, false); }, 400);
    }
  }
})();
  </script>
</body>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="theme-color" content="#000000" />
  <title>photo-transformer</title>
  <style>
    :root {
      --bg: #000;
      --fg: #fff;
      --muted: #888;
      --bar: #fff;
      --tap: 52px;
      --safe-b: env(safe-area-inset-bottom, 0px);
      --safe-t: env(safe-area-inset-top, 0px);
      --err: #ff6b6b;
      --panel: #111;
      --border: #333;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body {
      min-height: 100%;
      background: var(--bg);
      color: var(--fg);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-text-size-adjust: 100%;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100dvh;
      padding: calc(16px + var(--safe-t)) 16px calc(16px + var(--safe-b));
      gap: 16px;
    }
    h1 {
      font-size: 1.1rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      color: var(--fg);
    }
    .screen { display: none; width: min(100%, 360px); flex-direction: column; align-items: stretch; gap: 16px; }
    .screen.active { display: flex; }
    #loginScreen.active { width: min(100%, 320px); }
    .field { display: flex; flex-direction: column; gap: 8px; }
    .field label { font-size: 0.8rem; color: var(--muted); }
    .field input {
      min-height: var(--tap);
      width: 100%;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
      color: var(--fg);
      font-size: 1rem;
      padding: 0 14px;
      outline: none;
      -webkit-appearance: none;
    }
    .field input:focus { border-color: #666; }
    .error {
      font-size: 0.85rem;
      color: var(--err);
      text-align: center;
      min-height: 1.2em;
    }
    .app-layout {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: 100%;
      min-height: 0;
    }
    .app-main {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 14px;
      width: 100%;
      min-width: 0;
    }
    .preview {
      width: 100%;
      aspect-ratio: 1;
      max-height: min(52vw, 320px);
      background: var(--panel);
      border-radius: 12px;
      overflow: hidden;
      display: none;
      position: relative;
    }
    .preview.visible { display: block; }
    .preview img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    .preview-badge {
      position: absolute;
      right: 8px;
      bottom: 8px;
      background: rgba(0,0,0,0.75);
      color: #fff;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 8px;
      border-radius: 8px;
      pointer-events: none;
    }
    .progress {
      width: 100%;
      height: 4px;
      background: #222;
      border-radius: 2px;
      overflow: hidden;
      display: none;
    }
    .progress.visible { display: block; }
    .progress-bar {
      height: 100%;
      width: 0%;
      background: var(--bar);
      transition: width 0.2s ease;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 10px;
      width: 100%;
    }
    .btn {
      min-height: var(--tap);
      width: 100%;
      border: none;
      border-radius: 12px;
      font-size: 1.05rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      user-select: none;
    }
    .btn:active { opacity: 0.85; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }
    .btn-primary, .btn-upload {
      background: var(--fg);
      color: var(--bg);
    }
    .btn-drive {
      background: transparent;
      color: var(--fg);
      border: 1.5px solid #444;
    }
    .btn-drive.connected { border-color: var(--fg); }
    .btn-download {
      background: transparent;
      color: var(--fg);
      border: 1.5px solid #444;
    }
    .btn-download:not(:disabled) { border-color: var(--fg); }
    .btn-process {
      background: var(--fg);
      color: var(--bg);
      display: none;
      min-height: 44px;
      font-size: 0.95rem;
    }
    .btn-process.visible { display: block; }
    .btn-ghost {
      background: transparent;
      color: var(--muted);
      font-size: 0.9rem;
      font-weight: 500;
      min-height: 40px;
    }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      gap: 12px;
    }
    .topbar h1 { flex: 1; text-align: center; }
    .hint {
      font-size: 0.8rem;
      color: var(--muted);
      text-align: center;
      min-height: 1.2em;
    }
    .hidden-input {
      position: absolute;
      width: 1px;
      height: 1px;
      opacity: 0;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
    }
    .drive-panel {
      display: none;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      min-height: 0;
      order: -1;
    }
    .drive-panel.visible { display: flex; }
    .drive-nav {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
    }
    .drive-back {
      flex-shrink: 0;
      min-height: 34px;
      padding: 0 10px;
      border: 1.5px solid #444;
      border-radius: 10px;
      background: transparent;
      color: var(--fg);
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .drive-back:disabled {
      opacity: 0.35;
      cursor: not-allowed;
    }
    .drive-path {
      flex: 1;
      font-size: 0.8rem;
      color: var(--muted);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .drive-list {
      max-height: min(42dvh, 360px);
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      overscroll-behavior: contain;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      background: var(--panel);
    }
    .drive-item {
      display: flex;
      align-items: center;
      gap: 8px;
      width: 100%;
      min-height: 36px;
      padding: 5px 10px;
      border: none;
      border-bottom: 1px solid #222;
      background: transparent;
      color: var(--fg);
      font-size: 0.85rem;
      text-align: left;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .drive-item:last-child { border-bottom: none; }
    .drive-item:active { background: #1a1a1a; }
    .drive-item.selected { background: #1a1a1a; }
    .drive-item img {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      object-fit: cover;
      background: #222;
      flex-shrink: 0;
    }
    .drive-icon {
      width: 28px;
      height: 28px;
      border-radius: 5px;
      background: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
      font-size: 0.95rem;
    }
    .drive-item span.name {
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .drive-check {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 1.5px solid #555;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.7rem;
      color: #000;
      background: transparent;
    }
    .drive-item.selected .drive-check {
      background: #fff;
      border-color: #fff;
    }
    .drive-section {
      padding: 10px 12px 4px;
      font-size: 0.7rem;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
      border-bottom: 1px solid #222;
      background: #0a0a0a;
      position: sticky;
      top: 0;
      z-index: 1;
    }
    .drive-icon.shared { font-size: 1.15rem; }

    .drive-more {
      display: none;
      min-height: 40px;
      font-size: 0.9rem;
      font-weight: 600;
      border: 1.5px solid #444;
      border-radius: 10px;
      background: transparent;
      color: var(--fg);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .drive-more.visible { display: block; }
    .drive-more:disabled { opacity: 0.35; cursor: not-allowed; }

    /* Desktop / wide: Drive left (~40%, max 420px), controls right, top-aligned */
    @media (min-width: 800px) {
      body {
        align-items: center;
        justify-content: flex-start;
        padding: calc(20px + var(--safe-t)) 24px calc(20px + var(--safe-b));
      }
      #appScreen.active {
        width: min(100%, 860px);
        height: auto;
        max-height: none;
      }
      .app-layout {
        flex-direction: row;
        align-items: flex-start;
        justify-content: center;
        gap: 24px;
        height: auto;
        min-height: 0;
      }
      .drive-panel {
        order: 0;
        flex: 0 1 40%;
        width: min(40%, 420px);
        max-width: 420px;
        min-width: 260px;
      }
      .drive-panel.visible {
        display: flex;
        height: auto;
        max-height: calc(100dvh - 48px - var(--safe-t) - var(--safe-b));
      }
      .drive-list {
        flex: 1 1 auto;
        max-height: min(68dvh, 560px);
        min-height: 160px;
      }
      .app-main {
        flex: 0 0 340px;
        width: 340px;
        max-width: 340px;
        justify-content: flex-start;
        padding-top: 0;
      }
      .preview {
        max-height: 300px;
      }
      .app-layout:not(:has(.drive-panel.visible)) {
        justify-content: center;
      }
      .app-layout:not(:has(.drive-panel.visible)) .app-main {
        flex: 0 0 360px;
        width: 360px;
        max-width: 360px;
      }
    }

    @media (min-width: 1100px) {
      #appScreen.active { width: min(100%, 900px); }
      .app-main { flex-basis: 360px; width: 360px; max-width: 360px; }
      .preview { max-height: 320px; }
    }
  </style>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
</head>
<body>
  <div class="screen" id="loginScreen">
    <h1>photo-transformer</h1>
    <form id="loginForm" class="actions" autocomplete="on">
      <div class="field">
        <label for="userInput">Usuário</label>
        <input id="userInput" name="username" type="text" autocomplete="username" autocapitalize="none" spellcheck="false" required />
      </div>
      <div class="field">
        <label for="passInput">Senha</label>
        <input id="passInput" name="password" type="password" autocomplete="current-password" required />
      </div>
      <p class="error" id="loginError" aria-live="polite"></p>
      <button type="submit" class="btn btn-primary" id="btnLogin">Entrar</button>
    </form>
  </div>

  <div class="screen" id="appScreen">
    <div class="app-layout">
      <aside class="drive-panel" id="drivePanel" aria-label="Navegador do Google Drive">
        <div class="drive-nav">
          <button type="button" class="drive-back" id="btnDriveBack" disabled>Voltar</button>
          <span class="drive-path" id="drivePath">Meu Drive</span>
        </div>
        <div class="drive-list" id="driveList" aria-label="Pastas e arquivos do Drive"></div>
        <button type="button" class="drive-more" id="btnDriveMore" hidden>Carregar mais</button>
        <button type="button" class="btn btn-process" id="btnProcessDrive" disabled>Processar selecionadas</button>
      </aside>

      <main class="app-main">
        <div class="topbar">
          <span style="width:48px" aria-hidden="true"></span>
          <h1>photo-transformer</h1>
          <button type="button" class="btn btn-ghost" id="btnLogout" style="width:auto;padding:0 8px">Sair</button>
        </div>

        <div class="preview" id="preview" aria-hidden="true">
          <img id="previewImg" alt="Pré-visualização 1200×1200" />
          <span class="preview-badge" id="previewBadge" hidden></span>
        </div>

        <div class="progress" id="progress" aria-hidden="true" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
          <div class="progress-bar" id="progressBar"></div>
        </div>

        <div class="actions">
          <input type="file" id="fileInput" class="hidden-input" accept="image/*" multiple />
          <button type="button" class="btn btn-upload" id="btnUpload">Upload</button>
          <button type="button" class="btn btn-drive" id="btnDrive">Conectar Drive</button>
          <button type="button" class="btn btn-download" id="btnDownload" disabled>Download</button>
        </div>

        <p class="hint" id="hint">1200×1200 · foto inteira · fundo branco</p>
      </main>
    </div>
  </div>

  <script>
(function () {
  "use strict";

  var SIZE = 1200;
  var JPEG_QUALITY = 0.92;
  var SESSION_KEY = "pt_auth";
  var DRIVE_TOKEN_KEY = "pt_drive_token";
  var USER = "admin";
  var PASS = "rmcampigotto@123";
  var GOOGLE_CLIENT_ID = "440396226410-dmmt5bh0r93atn83hoq3bee0d09ejkg8.apps.googleusercontent.com";
  var DRIVE_SCOPE = "https://www.googleapis.com/auth/drive.readonly";
  var FOLDER_MIME = "application/vnd.google-apps.folder";

  var loginScreen = document.getElementById("loginScreen");
  var appScreen = document.getElementById("appScreen");
  var loginForm = document.getElementById("loginForm");
  var loginError = document.getElementById("loginError");
  var btnLogout = document.getElementById("btnLogout");

  var fileInput = document.getElementById("fileInput");
  var btnUpload = document.getElementById("btnUpload");
  var btnDrive = document.getElementById("btnDrive");
  var btnDownload = document.getElementById("btnDownload");
  var btnProcessDrive = document.getElementById("btnProcessDrive");
  var btnDriveBack = document.getElementById("btnDriveBack");
  var preview = document.getElementById("preview");
  var previewImg = document.getElementById("previewImg");
  var previewBadge = document.getElementById("previewBadge");
  var progress = document.getElementById("progress");
  var progressBar = document.getElementById("progressBar");
  var hint = document.getElementById("hint");
  var drivePanel = document.getElementById("drivePanel");
  var driveList = document.getElementById("driveList");
  var drivePath = document.getElementById("drivePath");
  var btnDriveMore = document.getElementById("btnDriveMore");

  var results = [];
  var downloadUrl = null;
  var downloadName = "photo-1200x1200.jpg";
  var driveAccessToken = null;
  var tokenClient = null;
  var busy = false;
  var driveFolderId = "root";
  var driveFolderStack = [{ id: "root", name: "Meu Drive", kind: "root" }];
  var driveActiveDriveId = null;
  var driveSelected = {};
  var driveNextPageToken = null;
  var driveListed = [];
  var driveSharedListed = [];
  var SHARED_DRIVE_KIND = "sharedDrive";

  function showLogin() {
    loginScreen.classList.add("active");
    appScreen.classList.remove("active");
    loginError.textContent = "";
  }

  function showApp() {
    loginScreen.classList.remove("active");
    appScreen.classList.add("active");
  }

  function isAuthed() {
    try { return sessionStorage.getItem(SESSION_KEY) === "1"; } catch (e) { return false; }
  }

  function setAuthed(on) {
    try {
      if (on) sessionStorage.setItem(SESSION_KEY, "1");
      else sessionStorage.removeItem(SESSION_KEY);
    } catch (e) {}
  }

  function loadStoredToken() {
    try {
      var t = sessionStorage.getItem(DRIVE_TOKEN_KEY);
      if (t) driveAccessToken = t;
    } catch (e) {}
  }

  function storeToken(token) {
    driveAccessToken = token || null;
    try {
      if (token) sessionStorage.setItem(DRIVE_TOKEN_KEY, token);
      else sessionStorage.removeItem(DRIVE_TOKEN_KEY);
    } catch (e) {}
  }

  function updateDriveButton() {
    if (driveAccessToken) {
      btnDrive.textContent = "Do Drive";
      btnDrive.classList.add("connected");
    } else {
      btnDrive.textContent = "Conectar Drive";
      btnDrive.classList.remove("connected");
      hideDrivePanel();
    }
  }

  function hideDrivePanel() {
    drivePanel.classList.remove("visible");
    driveList.innerHTML = "";
    btnProcessDrive.classList.remove("visible");
    btnProcessDrive.disabled = true;
    driveSelected = {};
    driveNextPageToken = null;
    driveListed = [];
    driveSharedListed = [];
    driveActiveDriveId = null;
    updateDriveMoreButton();
  }

  function updateDriveMoreButton() {
    if (driveNextPageToken) {
      btnDriveMore.hidden = false;
      btnDriveMore.classList.add("visible");
      btnDriveMore.disabled = busy;
      btnDriveMore.textContent = "Carregar mais";
    } else {
      btnDriveMore.hidden = true;
      btnDriveMore.classList.remove("visible");
      btnDriveMore.disabled = true;
    }
  }

  function updateProcessButton() {
    var n = Object.keys(driveSelected).length;
    if (n > 0) {
      btnProcessDrive.classList.add("visible");
      btnProcessDrive.disabled = busy;
      btnProcessDrive.textContent = n === 1
        ? "Processar 1 selecionada"
        : "Processar " + n + " selecionadas";
    } else {
      btnProcessDrive.classList.remove("visible");
      btnProcessDrive.disabled = true;
      btnProcessDrive.textContent = "Processar selecionadas";
    }
  }

  function updateDrivePath() {
    var names = driveFolderStack.map(function (f) { return f.name; });
    drivePath.textContent = names.join(" / ");
    btnDriveBack.disabled = driveFolderStack.length <= 1 || busy;
  }

  function authErrorHint(err) {
    var msg = (err && (err.error || err.message || err.type)) || "";
    msg = String(msg).toLowerCase();
    if (msg.indexOf("popup_closed") !== -1 || msg.indexOf("popup_closed_by_user") !== -1) {
      return "Login cancelado";
    }
    if (msg.indexOf("access_denied") !== -1) {
      return "Acesso negado. Verifique permissões no Google";
    }
    if (msg.indexOf("idpiframe_initialization_failed") !== -1 || msg.indexOf("origin") !== -1) {
      return "Origem não autorizada no Google Cloud";
    }
    if (msg.indexOf("immediate_failed") !== -1) {
      return "Sessão Google expirada. Conecte novamente";
    }
    return "Falha na autenticação Google";
  }

  function ensureTokenClient() {
    if (tokenClient) return true;
    if (!window.google || !google.accounts || !google.accounts.oauth2) {
      hint.textContent = "Google Identity ainda carregando…";
      return false;
    }
    tokenClient = google.accounts.oauth2.initTokenClient({
      client_id: GOOGLE_CLIENT_ID,
      scope: DRIVE_SCOPE,
      callback: function (resp) {
        if (resp && resp.error) {
          console.error(resp);
          hint.textContent = authErrorHint(resp);
          return;
        }
        if (!resp || !resp.access_token) {
          hint.textContent = "Falha na autenticação Google";
          return;
        }
        storeToken(resp.access_token);
        updateDriveButton();
        hint.textContent = "Drive conectado";
        openDriveBrowser();
      },
      error_callback: function (err) {
        console.error(err);
        hint.textContent = authErrorHint(err);
      }
    });
    return true;
  }

  function connectDrive() {
    if (!ensureTokenClient()) return;
    hint.textContent = "Abrindo Google…";
    try {
      tokenClient.requestAccessToken({ prompt: driveAccessToken ? "" : "consent" });
    } catch (e) {
      console.error(e);
      hint.textContent = authErrorHint(e);
    }
  }

  function openDriveBrowser() {
    driveFolderStack = [{ id: "root", name: "Meu Drive", kind: "root" }];
    driveFolderId = "root";
    driveActiveDriveId = null;
    driveSelected = {};
    driveNextPageToken = null;
    driveListed = [];
    driveSharedListed = [];
    loadDriveView();
  }

  function currentStackEntry() {
    return driveFolderStack[driveFolderStack.length - 1] || { id: "root", name: "Meu Drive", kind: "root" };
  }

  function isRootView() {
    return currentStackEntry().kind === "root";
  }

  function driveChildrenQuery(folderId) {
    return "'" + folderId + "' in parents and trashed=false and (mimeType = '" + FOLDER_MIME + "' or mimeType contains 'image/')";
  }

  function recentImagesQuery() {
    return "mimeType contains 'image/' and trashed=false";
  }

  function rootFoldersQuery() {
    return "'root' in parents and trashed=false and mimeType = '" + FOLDER_MIME + "'";
  }

  function sortDriveFiles(files) {
    var folders = [];
    var images = [];
    (files || []).forEach(function (f) {
      if (!f) return;
      if (f._type === SHARED_DRIVE_KIND) return;
      if (f.mimeType === FOLDER_MIME) folders.push(f);
      else if (f.mimeType && String(f.mimeType).indexOf("image/") === 0) images.push(f);
      else if (f.mimeType && String(f.mimeType).indexOf("image/") !== -1) images.push(f);
    });
    function byName(a, b) {
      var an = (a.name || "").toLowerCase();
      var bn = (b.name || "").toLowerCase();
      if (an < bn) return -1;
      if (an > bn) return 1;
      return 0;
    }
    folders.sort(byName);
    images.sort(byName);
    return folders.concat(images);
  }

  function buildFilesListUrl(opts) {
    opts = opts || {};
    var url = "https://www.googleapis.com/drive/v3/files"
      + "?pageSize=" + encodeURIComponent(String(opts.pageSize || 100))
      + "&q=" + encodeURIComponent(opts.q)
      + "&fields=" + encodeURIComponent("nextPageToken,files(id,name,mimeType,thumbnailLink,driveId,modifiedTime)")
      + "&spaces=drive"
      + "&includeItemsFromAllDrives=true"
      + "&supportsAllDrives=true";
    if (opts.corpora) url += "&corpora=" + encodeURIComponent(opts.corpora);
    if (opts.driveId) url += "&driveId=" + encodeURIComponent(opts.driveId);
    if (opts.orderBy) url += "&orderBy=" + encodeURIComponent(opts.orderBy);
    if (opts.pageToken) url += "&pageToken=" + encodeURIComponent(opts.pageToken);
    return url;
  }

  function buildSharedDrivesUrl(pageToken) {
    var url = "https://www.googleapis.com/drive/v3/drives"
      + "?pageSize=100"
      + "&fields=" + encodeURIComponent("nextPageToken,drives(id,name)");
    if (pageToken) url += "&pageToken=" + encodeURIComponent(pageToken);
    return url;
  }

  async function driveFetchJson(url) {
    var res = await fetch(url, {
      headers: { Authorization: "Bearer " + driveAccessToken }
    });
    if (res.status === 401 || res.status === 403) {
      var err = new Error("auth");
      err.code = res.status;
      throw err;
    }
    if (!res.ok) {
      var body = "";
      try { body = await res.text(); } catch (e) {}
      console.error("Drive API", res.status, body);
      var e2 = new Error("api");
      e2.status = res.status;
      e2.body = body;
      throw e2;
    }
    return res.json();
  }

  async function fetchAllSharedDrives() {

    var pageToken = null;
    do {
      var data = await driveFetchJson(buildSharedDrivesUrl(pageToken));
      var drives = (data && data.drives) || [];
      drives.forEach(function (d) {
        if (d && d.id) {
          all.push({
            id: d.id,
            name: d.name || "Drive compartilhado",
            _type: SHARED_DRIVE_KIND,
            mimeType: "application/vnd.photo-transformer.shared-drive"
          });
        }
      });
      pageToken = (data && data.nextPageToken) || null;
    } while (pageToken);
    all.sort(function (a, b) {
      var an = (a.name || "").toLowerCase();
      var bn = (b.name || "").toLowerCase();
      if (an < bn) return -1;
      if (an > bn) return 1;
      return 0;
    });
    return all;

  async function loadRootView(opts) {
    opts = opts || {};
    var append = !!opts.append;
    beginDriveLoad(append, "Carregando Drive…");

    try {
      if (!append) {
        driveSharedListed = [];

        try {
          driveSharedListed = await fetchAllSharedDrives();
        } catch (err) {
          if (err && err.message === "auth") {

            return;
          }
          console.error(err);
          driveSharedListed = [];
        }

        var folderData;
        try {
          folderData = await driveFetchJson(buildFilesListUrl({
            q: rootFoldersQuery(),
            pageSize: 100,
            corpora: "user"
          }));
        } catch (err) {
          if (err && err.message === "auth") {
            handleDriveAuthError();
            return;
          }
          console.error(err);
          folderData = { files: [] };
        }

        var recentData;
        try {
          recentData = await driveFetchJson(buildFilesListUrl({
            q: recentImagesQuery(),
            pageSize: 50,
            corpora: "allDrives"
          }));
        } catch (err) {
          if (err && err.message === "auth") {
            handleDriveAuthError();
            return;
          }
          console.error(err);
          recentData = { files: [] };
        }

        var folders = ((folderData && folderData.files) || []).filter(function (f) {
          return f && f.mimeType === FOLDER_MIME;
        });
        var images = ((recentData && recentData.files) || []).filter(function (f) {
          return f && f.mimeType && String(f.mimeType).indexOf("image/") !== -1;
        });
        images.sort(function (a, b) {
          var at = a.modifiedTime || "";
          var bt = b.modifiedTime || "";
          if (at < bt) return 1;
          if (at > bt) return -1;
          return 0;
        });
        driveListed = folders.concat(images);
        driveNextPageToken = (recentData && recentData.nextPageToken) || null;
      } else {
        if (!driveNextPageToken) {
          endDriveLoad();
          setProgress(0, false);
          return;
        }
        var moreData = await driveFetchJson(buildFilesListUrl({
          q: recentImagesQuery(),
          pageSize: 50,
          corpora: "allDrives",
          pageToken: driveNextPageToken
        }));
        var seen = {};
        driveListed.forEach(function (f) { if (f && f.id) seen[f.id] = true; });
        ((moreData && moreData.files) || []).forEach(function (f) {
          if (f && f.id && !seen[f.id] && f.mimeType && String(f.mimeType).indexOf("image/") !== -1) {
            driveListed.push(f);
            seen[f.id] = true;
          }
        });
        driveNextPageToken = (moreData && moreData.nextPageToken) || null;

      renderRootDriveList();
      setProgress(100, true);
      setTimeout(function () { setProgress(0, false); }, 300);
    } catch (err) {

        handleDriveAuthError();

  function baseName(name) {

  function uniqueName(base, used) {
    var name = base + "-1200x1200.jpg";
    var n = 2;
    while (used[name]) {

  function loadOriented(blob) {
    if (typeof createImageBitmap === "function") {
      return createImageBitmap(blob, { imageOrientation: "from-image" }).catch(function () {
        return createImageBitmap(blob).catch(function () {
          return loadViaImage(blob);
        });
      });
    }
    return loadViaImage(blob);
  }

  function loadViaImage(blob) {
    return new Promise(function (resolve, reject) {
      var url = URL.createObjectURL(blob);
      var img = new Image();
      img.onload = function () {
        URL.revokeObjectURL(url);
        resolve(img);
      };
      img.onerror = function () {
        URL.revokeObjectURL(url);
        reject(new Error("Falha ao carregar"));
      };
      img.src = url;
    });
  }

  function containToSquare(source) {
    var sw = source.width;
    var sh = source.height;
    if (!sw || !sh) throw new Error("Dimensões inválidas");
    var scale = Math.min(SIZE / sw, SIZE / sh);
    var dw = Math.round(sw * scale);
    var dh = Math.round(sh * scale);
    var dx = Math.floor((SIZE - dw) / 2);
    var dy = Math.floor((SIZE - dh) / 2);
    var canvas = document.createElement("canvas");
    canvas.width = SIZE;
    canvas.height = SIZE;
    var ctx = canvas.getContext("2d");
    if (!ctx) throw new Error("Canvas indisponível");
    ctx.fillStyle = "#FFFFFF";
    ctx.fillRect(0, 0, SIZE, SIZE);
    ctx.imageSmoothingEnabled = true;
    ctx.imageSmoothingQuality = "high";
    ctx.drawImage(source, 0, 0, sw, sh, dx, dy, dw, dh);
    return canvas;
  }

  function canvasToBlob(canvas) {
    return new Promise(function (resolve, reject) {
      if (canvas.toBlob) {
        canvas.toBlob(function (blob) {
          if (blob) resolve(blob);
          else reject(new Error("toBlob falhou"));
        }, "image/jpeg", JPEG_QUALITY);
      } else {
        try {
          var dataUrl = canvas.toDataURL("image/jpeg", JPEG_QUALITY);
          var parts = dataUrl.split(",");
          var bin = atob(parts[1]);
          var arr = new Uint8Array(bin.length);
          for (var i = 0; i < bin.length; i++) arr[i] = bin.charCodeAt(i);
          resolve(new Blob([arr], { type: "image/jpeg" }));
        } catch (e) {
          reject(e);
        }
      }
    });
  }

  async function processOne(file) {
    var source = null;
    try {
      source = await loadOriented(file);
      var canvas = containToSquare(source);
      var blob = await canvasToBlob(canvas);
      return { blob: blob, sourceName: file.name || "photo" };
    } finally {
      if (source && typeof source.close === "function") {
        try { source.close(); } catch (e) {}
      }
    }
  }

  async function buildDownload(items) {
    if (downloadUrl) {
      URL.revokeObjectURL(downloadUrl);
      downloadUrl = null;
    }
    if (items.length === 1) {
      downloadUrl = items[0].url;
      downloadName = items[0].name;
      return;
    }
    if (typeof JSZip === "undefined") {
      throw new Error("JSZip indisponível");
    }
    var zip = new JSZip();
    items.forEach(function (r) {
      zip.file(r.name, r.blob);
    });
    var zipBlob = await zip.generateAsync({ type: "blob" }, function (meta) {
      setProgress(90 + (meta.percent || 0) * 0.1, true);
    });
    downloadUrl = URL.createObjectURL(zipBlob);
    downloadName = "photo-transformer.zip";
  }

  async function processFiles(files) {
    if (busy) return;
    busy = true;
    clearResults();
    setBusyUI(true);
    hideDrivePanel();

    var total = files.length;
    var usedNames = {};
    var ok = 0;
    var fail = 0;

    hint.textContent = total === 1 ? "Processando…" : "Processando 1 de " + total + "…";
    setProgress(2, true);

    try {
      for (var i = 0; i < total; i++) {
        hint.textContent = total === 1
          ? "Processando…"
          : "Foto " + (i + 1) + " de " + total;
        setProgress(((i) / total) * 85 + 2, true);
        try {
          var out = await processOne(files[i]);
          var name = uniqueName(baseName(out.sourceName), usedNames);
          var url = URL.createObjectURL(out.blob);
          results.push({ blob: out.blob, name: name, url: url });
          ok++;
          previewImg.src = url;
          preview.classList.add("visible");
          preview.setAttribute("aria-hidden", "false");
          if (total > 1) {
            previewBadge.hidden = false;
            previewBadge.textContent = ok + " / " + total;
          } else {
            previewBadge.hidden = true;
          }
        } catch (err) {
          console.error(err);
          fail++;
        }
        setProgress(((i + 1) / total) * 85 + 2, true);
      }

      if (!results.length) {
        hint.textContent = "Erro ao processar as imagens";
        clearResults();
        setProgress(0, false);
        return;
      }

      hint.textContent = results.length > 1 ? "Gerando ZIP…" : "Finalizando…";
      setProgress(88, true);
      await buildDownload(results);
      setProgress(100, true);

      btnDownload.disabled = false;
      if (results.length === 1) {
        hint.textContent = "Pronto · 1200×1200";
        btnDownload.textContent = "Download";
      } else {
        previewBadge.hidden = false;
        previewBadge.textContent = results.length + " prontas";
        hint.textContent = fail
          ? results.length + " prontas · " + fail + " com erro · ZIP"
          : results.length + " prontas · photo-transformer.zip";
        btnDownload.textContent = "Download ZIP";
      }
    } catch (err) {
      console.error(err);
      hint.textContent = "Erro ao processar as imagens";
      clearResults();
    } finally {
      busy = false;
      setBusyUI(false);
      setTimeout(function () { setProgress(0, false); }, 400);
    }
  }
})();
  </script>
</body>
</html>
